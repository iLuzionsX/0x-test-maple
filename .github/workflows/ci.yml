name: Maples CI

on:
  push:
    branches:
      - feat/maples-playable-vertical-slice
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: maples-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
